<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  /*KITJS*/
  const tl = gsap.timeline({ paused: true }); kit(tl, "f03", {{DUR}});
  const F = 1 / 30, B = 0.5217, T3 = 1.043;
  tl.fromTo("#f03-band", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out" }, 0.02);
  tl.fromTo("#f03-c3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.3);
  tl.fromTo("#f03-c2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.4);
  tl.fromTo("#f03-eye", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.1);
  // beat 1: PISA slams
  tl.fromTo("#f03-w1", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "expo.out" }, 0);
  tl.to("#f03-shake", { keyframes: [{ x: -6, y: 4, duration: F }, { x: 5, y: -3, duration: F }, { x: 0, y: 0, duration: F }] }, 0.2);
  // beat 2: FUERTE. side-snaps with a motion-blur streak
  tl.fromTo("#f03-w2", { x: 900, opacity: 0, filter: "blur(18px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power4.out" }, B);
  // beat 3: the shoe drops and stomps
  tl.fromTo("#f03-drop", { y: -1000 }, { y: 0, duration: 0.24, ease: "power4.in" }, T3 - 0.24);
  tl.fromTo("#f03-shoe", { scaleY: 1, scaleX: 1 }, { scaleY: 0.82, scaleX: 1.12, duration: 2 * F, ease: "none" }, T3);
  tl.to("#f03-shoe", { scaleY: 1, scaleX: 1, duration: 0.28, ease: "back.out(2)" }, T3 + 2 * F);
  tl.fromTo("#f03-ground", { scaleY: 1 }, { scaleY: 2.4, duration: 0.06, ease: "power2.out" }, T3);
  tl.to("#f03-ground", { scaleY: 1, duration: 0.14, ease: "power2.in" }, T3 + 0.06);
  tl.fromTo("#f03-ring", { scale: 0, opacity: 0.8 }, { scale: 1.6, opacity: 0, duration: 0.35, ease: "power2.out" }, T3);
  tl.to("#f03-shake", { keyframes: [{ x: 0, y: 9, duration: F }, { x: 4, y: -7, duration: F }, { x: -3, y: 4, duration: F }, { x: 0, y: 0, duration: F }] }, T3);
  // particles: deterministic ballistic burst from the sole's contact span
  const host = document.getElementById("f03-parts"), N = 24, P = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement("div"); d.className = "f03-pt " + ["a", "b", "c", "a"][i % 4]; d.id = "f03-pt" + i; host.appendChild(d);

    P.push({ el: d, x0: 760 + u * 780, vx: (v - 0.5) * 1700 + (u - 0.5) * 300, vy: -(700 + v * 900), rot: (i % 7) * 50 });
  }
  const drv = { t: 0 }, G = 3200;
  tl.fromTo(drv, { t: 0 }, { t: 0.82, duration: 0.82, ease: "none", onUpdate: () => {
    const t = drv.t;
    P.forEach(p => { gsap.set(p.el, { x: p.x0 + p.vx * t, y: 838 + p.vy * t + 0.5 * G * t * t, rotation: p.rot * t * 4, opacity: t <= 0 ? 0 : (t < 0.75 ? 1 : (0.82 - t) / 0.07) }); });
  }, immediateRender: false }, T3);

  tl.fromTo("#f03-read", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.6)" }, 1.25);
  window.__timelines["f03-pisa-fuerte"] = tl;
