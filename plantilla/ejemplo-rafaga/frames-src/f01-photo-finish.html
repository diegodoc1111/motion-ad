<template>

</style>
<div id="root" data-composition-id="f01-photo-finish" data-width="1920" data-height="1080">
  <div id="f01-bg" class="clip f01-bg" data-start="0" data-duration="{{DUR}}" data-track-index="0"></div>
  {{KIT|f01|01|PHOTO-FINISH|ink}}
  <div id="f01-lanes" class="f01-lanes"></div>
  <div id="f01-eye" class="f01-eye"><b>RÁFAGA</b> · LAB</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  /*KITJS*/
  const tl = gsap.timeline({ paused: true }); kit(tl, "f01", {{DUR}});
  const D = 2.337, X0 = 120, X1 = 1800, T0 = 0.2, TS = 1.1;
  // clock: elapsed video time (this frame starts at 0)
  const clk = document.getElementById("f01-clock"), o = { t: 0 };
  const fmt = s => { const m = Math.floor(s / 60), ss = Math.floor(s % 60), cc = Math.floor((s * 100) % 100); return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}.${String(cc).padStart(2,"0")}`; };
  tl.to(o, { t: D, duration: D, ease: "none", onUpdate: () => { clk.textContent = fmt(o.t); } }, 0);
  tl.fromTo("#f01-clock", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1.06, duration: 2.0, ease: "power1.out" }, T0);
  tl.fromTo("#f01-eye", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.05);
  tl.fromTo("#f01-lanes", { x: 0 }, { x: -20, duration: D, ease: "none" }, 0);
  // scan line + slit-scan reveal
  tl.fromTo("#f01-scanwrap", { x: X0 }, { x: X1, duration: TS, ease: "power2.inOut" }, T0);
  tl.fromTo("#f01-reveal", { clipPath: `inset(0px ${1920 - X0}px 0px 0px)` }, { clipPath: `inset(0px ${1920 - X1}px 0px 0px)`, duration: TS, ease: "power2.inOut" }, T0);
  tl.fromTo("#f01-echo", { clipPath: `inset(0px ${1920 - X0 - 260}px 0px 0px)` }, { clipPath: `inset(0px ${Math.max(0, 1920 - X1 - 260)}px 0px 0px)`, duration: TS, ease: "power2.inOut" }, T0);
  tl.fromTo("#f01-e1", { scaleX: 1.6, opacity: 0.22, x: 0 }, { scaleX: 1.0, opacity: 0, duration: TS + 0.15, ease: "power2.inOut" }, T0);
  tl.fromTo("#f01-e2", { scaleX: 1.3, opacity: 0.14, x: 0 }, { scaleX: 1.0, opacity: 0, duration: TS + 0.15, ease: "power2.inOut" }, T0);
  tl.fromTo("#f01-scanwrap", { x: X1 }, { x: 2100, duration: 0.18, ease: "power3.in", immediateRender: false }, 1.9);
  // tags on the beats
  tl.fromTo("#f01-tag1", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.6)" }, 0.522);
  tl.fromTo("#f01-tag2", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.6)" }, 1.043);
  // measurement scan: wireframe draws over the shoe, ground rule, progress strip
  tl.fromTo("#f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.3);
  tl.set("#f01-wire", { opacity: 0.6 }, 1.3);
  tl.fromTo("#f01-wire svg .ln", { strokeDashoffset: 3000 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.012 }, 1.3);
  tl.fromTo(["#f01-cota1", "#f01-cota2"], { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.45);
  tl.fromTo(["#f01-chip1", "#f01-chip2"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", stagger: 0.08 }, 1.6);
  tl.fromTo("#f01-strip", { scaleX: 0 }, { scaleX: 0.14, duration: D, ease: "none" }, 0);
  window.__timelines["f01-photo-finish"] = tl;
})();
</script>
</template>
