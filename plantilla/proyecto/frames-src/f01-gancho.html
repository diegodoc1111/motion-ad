<script>
(() => {

  const tl = gsap.timeline({ paused: true }); kit(tl, "f01", {{DUR}});

  tl.fromTo("#f01-prod", { y: -900 }, { y: 0, duration: 0.3, ease: "power4.in" }, B - 0.3);
  tl.fromTo("#f01-prod", { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, B);
